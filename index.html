<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento Project</title>
  <link rel="icon" type="image/png" href="img/Logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: black !important;
    }

    .card {
      min-height: 0;
      border-radius: 0;
      overflow: hidden;
      box-shadow: inset 0 0 0 3px #000;
    }

    #c5Vid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 60% 30%;
    }

    #c6Img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% 0%;
    }

    #c3Vid {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body data-bs-theme="dark">
  <div class="container-fluid">
    <div class="row g-0">

      <div class="col-6">
        <div class="row g-0">
          <div class="col-8">
            <div class="card" style="height: 25vh;">
              <img src="img/c1Img.jpg">
            </div>
          </div>
          <div class="col-4">
            <div class="card" style="height: 25vh;">
              <img src="img/c2Img.png" id="c2Img">
            </div>
          </div>
          <div class="row g-0">
            <div class="col-12">
              <div class="card overflow-hidden" style="height: 50vh;">
                <video autoplay muted loop id="c5Vid">
                  <source src="img/c5vd.mp4" type="video/mp4">
                </video>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-4">
        <div class="row g-0">
          <div class="col-12">
            <div class="card" style="height: 75vh;">
              <video autoplay muted loop id="c3Vid">
                <source src="img/c3Vid.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>

      <div class="col-2">
        <div class="row g-0">
          <div class="col-12">
            <div class="card" style="height: 25vh;">
              <img src="img/c4Img.jpg" id="c4Img">
            </div>
          </div>
        </div>
        <div class="row g-0">
          <div class="col-12">
            <div class="card" style="height: 50vh;">
              <img src="img/c6Img.jpg" id="c6Img">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-0">
      <div class="col-2">
        <div class="card" style="height: 25vh;">
          <img src="img/c7Img.jpg">
        </div>
      </div>
      <div class="col-6">
        <div class="card" style="height: 25vh;">
          <img src="img/c8Img.jpg" id="c8Img">
        </div>
      </div>
      <div class="col-2">
        <div class="card" style="height: 25vh;">
          <img src="img/c9Img.jpg">
        </div>
      </div>
      <div class="col-2">
        <div class="card" style="height: 25vh;">
          <img src="img/c10Img.jpg" id="c10Img">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>

  <div id="unmuteOverlay" style="
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5);
    cursor: pointer;
    transition: opacity 0.4s ease;">
    <div style="text-align: center; color: white; pointer-events: none;">
      <div style="font-size: 1.1rem; margin-top: 8px; letter-spacing: 1px;">Click anywhere to play with sound</div>
    </div>
  </div>

  <script>
    document.getElementById('unmuteOverlay').addEventListener('click', function () {
      document.querySelectorAll('video').forEach(v => v.muted = false);
      this.style.opacity = '0';
      this.style.pointerEvents = 'none';
    });
  </script>
</body>

</html>
